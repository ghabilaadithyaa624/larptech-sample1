services:
  - type: web
    name: larptech-backend
    env: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: LarpTech Leads <leads@larptech.io>
      - key: LEAD_INBOX_EMAIL
        value: team@larptech.io
